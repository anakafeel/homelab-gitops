# Two sources: the Helm chart from its registry, plus this repo for the values
# file ($values is the repo checkout, referenced by "ref: values").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: kps # short prefix: kps-grafana, kps-prometheus, ...
        valueFiles:
          - $values/infra/monitoring/helm/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/anakafeel/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Prometheus operator CRDs are too big for client-side apply
