apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anakafeel/homelab-gitops.git
    targetRevision: main
    path: infra/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true    # only prunes resources Argo CD created; the hand-made Secret is safe
      selfHeal: true
