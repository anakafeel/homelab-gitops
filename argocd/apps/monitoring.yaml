apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # namespace + Grafana secret before the chart
spec:
  project: default
  source:
    repoURL: https://github.com/anakafeel/homelab-gitops.git
    targetRevision: main
    path: infra/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # no decrypted copy in last-applied annotation
      # Probe/PrometheusRule CRDs come from kube-prometheus-stack (wave 1);
      # on a fresh cluster they don't exist yet when this app first syncs.
      - SkipDryRunOnMissingResource=true
