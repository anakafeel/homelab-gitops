apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-oauth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # secret first, then the operator
spec:
  project: default
  source:
    repoURL: https://github.com/anakafeel/homelab-gitops.git
    targetRevision: main
    path: infra/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # no decrypted copy in last-applied annotation
