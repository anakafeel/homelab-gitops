# OpenTofu plan on PRs, apply on main. State lives in Garage, reached over the
# tailnet (garage-s3, tag:k8s-garage:3900 only). Garage can't lock state, so
# the concurrency group is the lock: one run per stack at a time, never cancelled.
# tofu/bootstrap is not here: its state is in the cluster; it's run by hand.
name: tofu

on:
  pull_request:
    paths: ["tofu/**", ".github/workflows/tofu.yaml"]
  push:
    branches: [main]
    paths: ["tofu/**", ".github/workflows/tofu.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token -> Tailscale workload identity (no stored Tailscale secret)

env:
  TOFU_VERSION: 1.13.1
  TOFU_SHA256: 378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69
  AWS_ENDPOINT_URL_S3: http://garage-s3.tail15e8c8.ts.net:3900

jobs:
  tofu:
    # Fork PRs get no secrets and must never reach the tailnet.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        stack: [cloudflare]
    concurrency:
      group: tofu-${{ matrix.stack }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: tofu/${{ matrix.stack }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join tailnet (ephemeral, tag:ci)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:ci
          ping: garage-s3

      - name: Install tofu
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSLo tofu.tgz "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          echo "${TOFU_SHA256}  tofu.tgz" | sha256sum -c -
          tar xzf tofu.tgz tofu && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: tofu init -input=false -lockfile=readonly

      - name: Plan
        run: tofu plan -input=false -no-color -out=tfplan

      - name: Apply (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tofu apply -input=false -no-color tfplan
