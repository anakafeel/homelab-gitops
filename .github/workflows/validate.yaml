# Runs on every push and PR. Argo CD syncs main automatically, so broken
# YAML must be caught here, before it is merged.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  K8S_VERSION: 1.36.5 # match the cluster
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUBE_LINTER_VERSION: v0.8.3
  KUBE_LINTER_SHA256: 1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df
  TOFU_VERSION: 1.13.1
  TOFU_SHA256: 378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
  TFLINT_VERSION: v0.64.0
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Public repo: every *.sops.yaml must really be encrypted.
      - name: Secrets are encrypted
        run: |
          fail=0
          # (.sops.yaml at the root is the sops config itself, not a secret)
          for f in $(git ls-files '*.sops.yaml' | grep -v '^\.sops\.yaml$'); do
            if ! grep -q '^sops:' "$f" || ! grep -q 'ENC\[' "$f"; then
              echo "::error file=$f::not SOPS-encrypted"; fail=1
            fi
          done
          # No plain Secret manifests outside *.sops.yaml.
          for f in $(git ls-files '*.yaml' | grep -v '\.sops\.yaml$'); do
            if grep -qE '^kind:\s*Secret\s*$' "$f"; then
              echo "::error file=$f::plain Secret manifest; encrypt it as *.sops.yaml"; fail=1
            fi
          done
          exit $fail

      - name: Install tools
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          curl -sSLo kl.tgz "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  kl.tgz" | sha256sum -c -
          curl -sSLo tofu.tgz "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          echo "${TOFU_SHA256}  tofu.tgz" | sha256sum -c -
          # trivy and tflint as checksummed binaries, not their GitHub Actions
          # (trivy-action's tags were hijacked in a 2026 supply-chain attack).
          curl -sSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          curl -sSLo tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          tar xzf kc.tgz kubeconform && tar xzf kl.tgz kube-linter && tar xzf tofu.tgz tofu
          tar xzf trivy.tgz trivy && unzip -q tflint.zip tflint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Kustomize dirs without KSOPS generators must build (catches missing files).
      # Dirs with generators need the age key, which CI deliberately doesn't have.
      - name: Kustomize build
        run: |
          for k in $(git ls-files '*kustomization.yaml'); do
            d=$(dirname "$k")
            if grep -q '^generators:' "$k"; then echo "skip $d (KSOPS)"; continue; fi
            echo "build $d"; kubectl kustomize "$d" > /dev/null
          done

      - name: Schema check (kubeconform)
        run: |
          git ls-files 'apps/*.yaml' 'infra/*.yaml' 'argocd/*.yaml' 'bootstrap/*.yaml' \
            | grep -vE '(^|/)(kustomization|ksops-generator|values)\.yaml$|\.sops\.yaml$|^\.github/' \
            | xargs kubeconform -strict -summary \
                -kubernetes-version "${K8S_VERSION}" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Best practices (kube-linter)
        run: kube-linter lint --config .kube-linter.yaml apps infra

      # No state access here (Garage is only reachable on the tailnet):
      # format and static validation only, providers come from the lock files.
      - name: OpenTofu fmt + validate
        run: |
          tofu fmt -check -recursive -diff tofu
          for d in tofu/*/; do
            echo "validate $d"
            tofu -chdir="$d" init -backend=false -input=false -lockfile=readonly > /dev/null
            tofu -chdir="$d" validate
          done

      - name: OpenTofu lint (tflint)
        run: |
          for d in tofu/*/; do
            echo "tflint $d"
            tflint --chdir="$d" --format compact
          done

      # Misconfigurations in our manifests and OpenTofu code (HIGH/CRITICAL fail).
      # Accepted exceptions live in .trivyignore.yaml, each with a reason.
      - name: Misconfiguration scan (trivy)
        run: |
          trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL \
            --skip-files '**/*.sops.yaml' --ignorefile .trivyignore.yaml .
