# Umami web analytics for saimhashmi.is-a.dev. The dashboard is tailnet-only
# (ingress.yaml); the public site reaches only the tracker script and the
# collect endpoint (ingress-public.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  labels:
    app.kubernetes.io/name: umami
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # "nextjs" user baked into the image
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: umami-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami-db-app # created by CNPG
                  key: uri
            # Served as /insights.js instead of /script.js (fewer ad-blocker hits).
            - name: TRACKER_SCRIPT_NAME
              value: insights.js
            - name: DISABLE_TELEMETRY
              value: "1"
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # tested: migrations + server start fine; /tmp for Next.js/Prisma scratch
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 36 # DB migrations on first start can be slow on the Pi
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 160Mi # ~136Mi idle in a test run
            limits:
              memory: 320Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
