# Umami's database. Sized for the Pi: small buffers, few connections.
# No backups yet: losing visit history is acceptable for now.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  postgresql:
    parameters:
      shared_buffers: 32MB
      max_connections: "30"
  bootstrap:
    initdb:
      database: umami
      owner: umami
  managed:
    roles:
      # Read-only login for the Grafana datasource (infra/monitoring). The
      # other fields are the webhook's defaults, written out so Argo CD
      # doesn't show OutOfSync.
      - name: grafana_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: grafana-ro
  storage:
    storageClass: cnpg-local
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  monitoring:
    enablePodMonitor: true
