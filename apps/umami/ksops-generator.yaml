# Decrypts umami-env.sops.yaml (APP_SECRET, signs login tokens) and
# grafana-ro.sops.yaml (password of the read-only DB role Grafana uses).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: umami-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./umami-env.sops.yaml
  - ./grafana-ro.sops.yaml
