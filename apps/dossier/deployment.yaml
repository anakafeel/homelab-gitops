# Dossier job-search app (github.com/AienTech/dossier), arm64 build from
# .github/workflows/images.yaml. Tailnet only (ingress.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dossier
  labels:
    app.kubernetes.io/name: dossier
spec:
  replicas: 1 # upstream: one instance per database
  strategy:
    type: Recreate # never two pods running migrations against the same DB
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dossier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dossier
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user baked into the image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dossier
          image: ghcr.io/anakafeel/dossier:1.11.0-e0688dc@sha256:e83c669d766d6e3527c0a411b1c37fb0b85c2e27430c3d318d250348de7819bd
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: dossier-env # DOSSIER_SECRET, DOSSIER_PASSWORD, DOSSIER_AI_KEY (Gemini API, free tier)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dossier-db-app # created by CNPG
                  key: uri
            - name: TZ
              value: America/Toronto # nightly backup runs at 03:00 local
            # Defaults for Settings; a choice saved in the app wins.
            # Gemini through its OpenAI-compatible API (Dossier has no Gemini option).
            # 3.8-flash returned 503 "high demand" on 2026-11-03; lite answered.
            - name: DOSSIER_AI_PROVIDER
              value: openai
            - name: DOSSIER_AI_URL
              value: https://generativelanguage.googleapis.com/v1beta/openai
            - name: DOSSIER_AI_MODEL
              value: gemini-flash-lite-latest
            - name: DOSSIER_JOBS_SOURCE
              value: freehire # no key; the job agent can search it (1.10.0+)
            - name: DOSSIER_TELEMETRY
              value: "off"
            - name: DOSSIER_PUBLIC_URL
              value: https://dossier.tail15e8c8.ts.net # MCP connector addresses
            - name: HOME
              value: /tmp # Chromium/fontconfig caches; the image's home is read-only
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writes go to /data, /tmp and the Next.js cache
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60 # migrations + seed on first start are slow on the Pi
          # 5s timeouts: under swap pressure the Pi answers slowly, and the 1s
          # default had liveness restart the pod mid-request (2026-11-03).
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi # upstream's mem_limit: headroom for Chromium printing PDFs
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        # Backups and export zips. Pre-created on the Pi, owned by uid 1000.
        - name: data
          hostPath:
            path: /mnt/cnpg-data/dossier-files
            type: Directory
      nodeSelector:
        kubernetes.io/hostname: anakafeel-pi # hostPath lives on the Pi
