# Second public name, straight to the home IP (no CNAME): a working link for
# is-a.dev's review and a fallback if is-a.dev is ever down. Same routing as
# ingress-public.yaml; its own certificate so one name can't block the other.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-duckdns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - anakafeel.duckdns.org
      secretName: portfolio-duckdns-tls
  rules:
    - host: anakafeel.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-duckdns-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: anakafeel.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
