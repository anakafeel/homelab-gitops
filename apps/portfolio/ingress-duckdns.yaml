# Second public name, straight to the home IP (no CNAME). Every request 301s to
# saimhashmi.is-a.dev so search engines see one host, not duplicate content.
# Own certificate so https:// on this name still answers before redirecting.
# To use it as a fallback while is-a.dev is down, drop the middleware annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-duckdns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-duckdns-to-primary@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - anakafeel.duckdns.org
      secretName: portfolio-duckdns-tls
  rules:
    - host: anakafeel.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-duckdns-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-duckdns-to-primary@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: anakafeel.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
---
# Same path on the primary host. cert-manager's ACME solver Ingress has a longer
# path, so renewals for this name still reach the solver, not the redirect.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: duckdns-to-primary
spec:
  redirectRegex:
    regex: ^https?://anakafeel\.duckdns\.org/(.*)
    replacement: https://saimhashmi.is-a.dev/${1}
    permanent: true
