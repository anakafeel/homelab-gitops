# saimhashmi.is-a.dev: is-a.dev CNAME -> saimhashmi.duckdns.org (kept current by
# infra/ddns) -> home router :80/:443 -> Traefik on the Pi. TLS from cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - saimhashmi.is-a.dev
      secretName: portfolio-tls
  rules:
    - host: saimhashmi.is-a.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
---
# Plain HTTP on the public host redirects to HTTPS. cert-manager's ACME solver
# Ingress has a longer path (/.well-known/acme-challenge/...), so Traefik routes
# challenges to it ahead of this redirect.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-public-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: saimhashmi.is-a.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
