# Plain manifests for the monitoring namespace. The kube-prometheus-stack chart
# itself is a separate Argo CD app (argocd/apps/kube-prometheus-stack.yaml) that
# reads its values from helm/kube-prometheus-stack/values.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - grafana-ingress.yaml
  - probes.yaml
  - rules.yaml
  - scrape-docker-cadvisor.yaml
generators:
  - ksops-generator.yaml # -> Secrets grafana-admin, alertmanager-discord, grafana-cloudwatch, alertmanager-healthchecks
# Dashboards as ConfigMaps; the Grafana sidecar loads any ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: dashboard-vaultpi-overview
    files:
      - dashboards/vaultpi-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
