# kube-prometheus-stack values for a single-node k3s Raspberry Pi 4 (8GB).
# Chart: prometheus-community/kube-prometheus-stack (version pinned in
# argocd/apps/kube-prometheus-stack.yaml; Renovate opens bump PRs).
# Goal: small footprint. Short retention, 60s scrapes, low requests.

crds:
  enabled: true

# k3s runs etcd, scheduler, controller-manager and kube-proxy inside the one
# k3s binary, so Prometheus can't scrape them as separate targets. Leaving
# these on gives permanent false "TargetDown" alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 4GB # hard cap, below the PVC size
    scrapeInterval: 60s
    evaluationInterval: 60s
    # Pick up ServiceMonitors/PodMonitors/Probes/PrometheusRules from any
    # namespace, not only ones labelled with this Helm release.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1200Mi
    # local-path PVC -> /mnt/docker-root/k3s/storage (USB disk, not the SD card)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 6Gi

alertmanager:
  # Replaces the chart's default config (which sends everything to "null").
  # The inhibit rules are copied from the chart defaults.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Dead man's switch: Watchdog always fires, so re-sending it every
        # minute pings healthchecks.io. If the pings stop (Pi, k3s,
        # Prometheus or Alertmanager down), healthchecks.io alerts instead.
        - receiver: healthchecks
          matchers: ['alertname = "Watchdog"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        # InfoInhibitor is a helper and should not ping Discord.
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
    inhibit_rules:
      - source_matchers: ["severity = critical"]
        target_matchers: ["severity =~ warning|info"]
        equal: ["namespace", "alertname"]
      - source_matchers: ["severity = warning"]
        target_matchers: ["severity = info"]
        equal: ["namespace", "alertname"]
      - source_matchers: ["alertname = InfoInhibitor"]
        target_matchers: ["severity = info"]
        equal: ["namespace"]
      - target_matchers: ["alertname = InfoInhibitor"]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          # The URL is a secret, so it's read from a file: the Secret
          # alertmanager-discord (SOPS, infra/monitoring) mounted via
          # alertmanagerSpec.secrets below.
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
      - name: healthchecks
        webhook_configs:
          # The ping URL is a secret too: Secret alertmanager-healthchecks
          # (SOPS, infra/monitoring), mounted via alertmanagerSpec.secrets.
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
            send_resolved: false
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    secrets:
      - alertmanager-discord # -> /etc/alertmanager/secrets/alertmanager-discord/
      - alertmanager-healthchecks # -> /etc/alertmanager/secrets/alertmanager-healthchecks/
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 96Mi

grafana:
  # The chart's default -distroless build crashes on the Pi at startup
  # (SIGBUS / "traceback did not unwind" in the Go runtime, under both k3s and
  # Docker, on fresh pulls). The regular build of the same version runs fine.
  image:
    repository: grafana/grafana
    tag: 13.2.4
  # Login comes from the SOPS-encrypted Secret in infra/monitoring
  # (the chart's built-in default password is public knowledge).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Exposed via infra/monitoring/grafana-ingress.yaml (Tailscale) instead.
  ingress:
    enabled: false
  # Dashboards and datasources are provisioned from config, so no PVC.
  persistence:
    enabled: false
  defaultDashboardsTimezone: browser
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    users:
      allow_sign_up: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      # 384Mi left Grafana 13 at ~379Mi in steady state (2026-10-23).
      memory: 512Mi
