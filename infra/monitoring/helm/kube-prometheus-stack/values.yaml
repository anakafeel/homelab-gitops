# kube-prometheus-stack values for a single-node k3s Raspberry Pi 4 (8GB).
# Chart: prometheus-community/kube-prometheus-stack (version pinned in
# argocd/apps/kube-prometheus-stack.yaml; Renovate opens bump PRs).
# Goal: small footprint. Short retention, 60s scrapes, low requests.

crds:
  enabled: true

# k3s runs etcd, scheduler, controller-manager and kube-proxy inside the one
# k3s binary, so Prometheus can't scrape them as separate targets. Leaving
# these on gives permanent false "TargetDown" alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 4GB # hard cap, below the PVC size
    scrapeInterval: 60s
    evaluationInterval: 60s
    # Pick up ServiceMonitors/PodMonitors/Probes/PrometheusRules from any
    # namespace, not only ones labelled with this Helm release.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1200Mi
    # local-path PVC -> /mnt/docker-root/k3s/storage (USB disk, not the SD card)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 6Gi

alertmanager:
  # Replaces the chart's default config (which sends everything to "null").
  # The inhibit rules are copied from the chart defaults.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog always fires (proves the pipeline works); InfoInhibitor is
        # a helper. Neither should ping Discord.
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    inhibit_rules:
      - source_matchers: ["severity = critical"]
        target_matchers: ["severity =~ warning|info"]
        equal: ["namespace", "alertname"]
      - source_matchers: ["severity = warning"]
        target_matchers: ["severity = info"]
        equal: ["namespace", "alertname"]
      - source_matchers: ["alertname = InfoInhibitor"]
        target_matchers: ["severity = info"]
        equal: ["namespace"]
      - target_matchers: ["alertname = InfoInhibitor"]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          # The URL is a secret, so it's read from a file: the Secret
          # alertmanager-discord (SOPS, infra/monitoring) mounted via
          # alertmanagerSpec.secrets below.
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    secrets:
      - alertmanager-discord # -> /etc/alertmanager/secrets/alertmanager-discord/
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  # Host network: 9100 is still taken by the old Docker node_exporter.
  service:
    port: 9101
    targetPort: 9101
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 96Mi

grafana:
  # Login comes from the SOPS-encrypted Secret in infra/monitoring
  # (the chart's built-in default password is public knowledge).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Exposed via infra/monitoring/grafana-ingress.yaml (Tailscale) instead.
  ingress:
    enabled: false
  # AWS keys for the CloudWatch datasource, from the SOPS Secret
  # grafana-cloudwatch (infra/monitoring). Grafana expands ${VAR} in
  # provisioning files, so the keys never appear in a ConfigMap.
  envFromSecret: grafana-cloudwatch
  additionalDataSources:
    - name: CloudWatch
      uid: cloudwatch # the VaultPi Overview dashboard refers to this uid
      type: cloudwatch
      access: proxy
      editable: false
      jsonData:
        authType: keys
        defaultRegion: us-east-1
      secureJsonData:
        accessKey: ${AWS_ACCESS_KEY_ID}
        secretKey: ${AWS_SECRET_ACCESS_KEY}
  # Dashboards and datasources are provisioned from config, so no PVC.
  persistence:
    enabled: false
  defaultDashboardsTimezone: browser
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    users:
      allow_sign_up: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 384Mi
