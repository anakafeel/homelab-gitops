# Grafana on the tailnet only: the Tailscale operator creates a proxy device
# "grafana" with a Let's Encrypt cert -> https://grafana.<tailnet>.ts.net
# (same pattern as infra/argocd-ingress; the chart's own ingress is disabled).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kps-grafana
      port:
        number: 80
  tls:
    - hosts:
        - grafana
