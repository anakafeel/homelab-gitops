# Decrypts the Grafana admin login and the Alertmanager Discord webhook at render time (Argo CD repo-server + KSOPS).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: monitoring-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./grafana-admin.sops.yaml
  - ./alertmanager-discord.sops.yaml
