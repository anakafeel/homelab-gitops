# Argo CD Helm values for a single-node Raspberry Pi 4 (8GB).
# Chart: argo/argo-cd 10.10.5 (Argo CD v3.5.5)
# Install/upgrade:
#   helm upgrade --install argocd argo/argo-cd --version 10.10.5 \
#     -n argocd --create-namespace -f infra/argocd/values.yaml

global:
  domain: argocd.local # placeholder; real access comes via the Tailscale operator

configs:
  params:
    # TLS ends at the ingress / Tailscale proxy, not at argocd-server.
    server.insecure: true
    # Sync one app at a time (default 10). A burst of 9 merges on 2026-10-23 synced
    # in parallel, overloaded k3s's sqlite datastore and crashed k3s.
    controller.operation.processors: "1"
    controller.status.processors: "5"
    controller.kubectl.parallelism.limit: "5"
  cm:
    # How often Argo CD re-checks git; default is 120s, fine either way on a Pi.
    timeout.reconciliation: 180s
    # Let kustomize run the KSOPS exec plugin (decrypts *.sops.yaml at render time).
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

# SSO isn't needed for one user; the local admin account is enough.
dex:
  enabled: false

# Alerts go through Alertmanager -> ntfy in Phase 4 instead.
notifications:
  enabled: false

# Every component runs a single replica: there is only one node.
controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

repoServer:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # KSOPS: an init container copies the ksops plugin (and a matching kustomize)
  # into a shared emptyDir, which is mounted over /usr/local/bin in the repo server.
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age # age private key; created by hand, never in git
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /home/argocd/.config/sops/age
      name: sops-age
      readOnly: true
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /home/argocd/.config/sops/age/keys.txt

server:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

applicationSet:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
