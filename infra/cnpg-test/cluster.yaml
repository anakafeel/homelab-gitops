apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-test
spec:
  instances: 1
  storage:
    storageClass: cnpg-local
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true # the webhook adds it; without it Argo CD shows OutOfSync
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
