apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-test-daily
spec:
  schedule: "0 0 3 * * *" # 03:00 UTC (six fields: seconds first)
  backupOwnerReference: self
  immediate: true # first backup as soon as the cluster is up
  cluster:
    name: pg-test
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
