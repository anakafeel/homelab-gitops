# Keeps anakafeel.duckdns.org pointed at the home's public IPv4. saimhashmi.is-a.dev
# is a CNAME to it, so a new ISP IP (or a new house) heals itself within 5 min
# without touching is-a.dev. An empty ip= makes DuckDNS use the caller's address.
# A failing run raises KubeJobFailed in Alertmanager.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: duckdns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: update
              image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: duckdns
                      key: token
              command: ["/bin/sh", "-c"]
              # verbose=true answers "OK\n<ip>\n\n<UPDATED|NOCHANGE>"; the token is never echoed.
              args:
                - |
                  r=$(curl -fsS --max-time 30 "https://www.duckdns.org/update?domains=anakafeel&token=$TOKEN&ip=&verbose=true") || exit 1
                  echo "$r" | tr '\n' ' '; echo
                  [ "$(echo "$r" | head -n1)" = OK ]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  memory: 32Mi
