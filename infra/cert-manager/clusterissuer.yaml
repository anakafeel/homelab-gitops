# Let's Encrypt over HTTP-01: the router forwards :80 to Traefik on the Pi and
# cert-manager answers /.well-known/acme-challenge through a temporary Ingress.
# No email: Let's Encrypt no longer sends expiry mail; Prometheus watches expiry.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
