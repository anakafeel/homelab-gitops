apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    tunnel: 678b9f8d-6f32-4578-b438-2687f82a2dc1
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Send everything to Traefik; Traefik routes by Host header (Ingress objects).
      - hostname: saimhashmi.xyz
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404
