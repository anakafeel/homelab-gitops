# Exposes the Argo CD UI on the tailnet only (not the internet):
# the Tailscale operator creates a proxy device "argocd" with a
# Let's Encrypt cert, reachable at https://argocd.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
  tls:
    - hosts:
        - argocd
